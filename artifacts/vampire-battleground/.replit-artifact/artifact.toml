kind = "web"
previewPath = "/"
title = "Vampire Battleground"
description = "A playable fantasy arena prototype inspired by classic MMORPG battlegrounds and survivors-style auto-combat. Choose a class, survive PvE enemies and rival combatants, collect loot, and escape a shrinking fog ring."
version = "1.0.0"
id = "artifacts/vampire-battleground"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22912

[services.development]
run = "pnpm --filter @workspace/vampire-battleground run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vampire-battleground", "run", "build" ]
serve = "static"
publicDir = "artifacts/vampire-battleground/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22912"
BASE_PATH = "/"
