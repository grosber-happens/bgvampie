<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vampire Battleground 3D</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="crosshair"></div>
      <div id="stats">
        <div class="bar"><div id="hp-fill"></div></div>
        <div id="hp-text">100 / 100</div>
        <div id="weapon">Silah: Uzak (F)</div>
        <div class="bar small"><div id="dash-fill"></div></div>
        <div class="label">Dash (Shift)</div>
      </div>
      <div id="slots"></div>
      <div id="seed"></div>
      <div id="hint">WASD hareket · Space zıpla · Shift dash · Sol tık ateş · Sağ tık nişan · F silah değiştir · Q E 1 2 3 yetenekler · Esc duraklat</div>
    </div>
    <div id="overlay">
      <h1>Vampire Battleground 3D</h1>
      <p id="overlay-text">Hareket test alanı: binaların üstüne zıpla, dash at, iki silahı dene.</p>
      <button id="play">Oyna</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
