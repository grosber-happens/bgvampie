kind = "web"
previewPath = "/"
title = "Vampire Battleground 3D"
description = "3D third-person shooter prototype of Vampire Battleground (Babylon.js): camera, movement, aiming, shooting and local bots."
version = "1.0.0"
id = "artifacts/vampire-3d"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22913

[services.development]
run = "pnpm --filter @workspace/vampire-3d run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vampire-3d", "run", "build" ]
serve = "static"
publicDir = "artifacts/vampire-3d/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22913"
BASE_PATH = "/"
