<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Silah Atölyesi</title>
    <style>
      :root { --ink: #15131a; --paper: #f4ead8; --sun: #ff7a1a; }
      html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: 'Fredoka', system-ui, sans-serif; overflow: hidden; }
      canvas { width: 100%; height: 100%; display: block; outline: none; }
      #bar { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
      #bar > * { pointer-events: auto; }
      h1 { font-size: 20px; margin: 0 12px 0 0; letter-spacing: 0.02em; }
      button { font: inherit; font-size: 14px; border: 2px solid var(--ink); background: #fff8ec; border-radius: 10px; padding: 5px 11px; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); }
      button.on { background: var(--sun); color: #fff; }
      .group { display: flex; gap: 6px; }
      #note { position: fixed; left: 12px; bottom: 12px; max-width: 560px; font-size: 13px; background: #fff8ecdd; border: 2px solid var(--ink); border-radius: 10px; padding: 8px 10px; }
      #labels { position: fixed; inset: 0; pointer-events: none; }
      .lbl { position: absolute; transform: translate(-50%, 0); font-size: 12px; text-align: center; white-space: nowrap; background: #fff8eccc; border-radius: 6px; padding: 2px 6px; }
      .lbl b { display: block; font-size: 13px; }
      @media (max-width: 700px) { h1 { width: 100%; } #note { display: none; } }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="labels"></div>
    <div id="bar">
      <h1>Silah Atölyesi</h1>
      <div class="group" id="species"></div>
      <div class="group" id="modes"></div>
    </div>
    <div id="note"></div>
    <script type="module" src="/src/armory/showcase.ts"></script>
  </body>
</html>
