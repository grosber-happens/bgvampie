<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harita Planlayıcı · Vampire Battleground</title>
  </head>
  <body>
    <canvas id="view"></canvas>

    <header id="topbar" class="sheet">
      <a class="brand" href="./">Vampire <b>Battleground</b></a>
      <span id="crumbs" class="crumbs"></span>
      <span class="stats"><span id="stat-here">—</span><span id="stat-count"></span><span id="stat-time"></span><span id="stat-fps"></span></span>
      <button id="lang" class="chip"></button>
    </header>

    <nav id="tools" class="sheet"></nav>
    <section id="drawer" class="sheet hidden"></section>

    <aside id="panel" class="sheet">
      <div id="tabs" class="tabs" role="tablist"></div>
      <div id="panel-body"></div>
    </aside>
    <aside id="inside" class="sheet hidden"></aside>
    <button id="panel-toggle" class="sheet icon-btn"></button>

    <div id="mini-wrap" class="sheet"><canvas id="minimap"></canvas><span class="n">K</span></div>
    <div id="hint"></div>
    <div id="flash" role="status" aria-live="polite"></div>
    <input id="file" type="file" accept="application/json,.json" hidden />
    <script type="module" src="/src/planner/main.ts"></script>
  </body>
</html>
